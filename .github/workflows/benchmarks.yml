name: Performance Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/PDK.Tests.Performance/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/PDK.Tests.Performance/**'
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight
  workflow_dispatch:
    inputs:
      benchmark_filter:
        description: 'Benchmark filter (parsing, execution, optimization, realworld, all)'
        required: false
        default: 'all'

permissions:
  contents: read
  pull-requests: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release
        run: dotnet build --configuration Release --no-restore

      - name: Run Benchmarks
        working-directory: tests/PDK.Tests.Performance
        env:
          # Workflow inputs are free text: consume them through the environment, never by interpolating into the script.
          BENCHMARK_FILTER: ${{ github.event.inputs.benchmark_filter || 'all' }}
        run: |
          if [ "$BENCHMARK_FILTER" = "all" ]; then
            dotnet run -c Release -- --filter "*" --exporters json markdown
          else
            dotnet run -c Release -- --filter "*${BENCHMARK_FILTER}*" --exporters json markdown
          fi
        continue-on-error: true

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            tests/PDK.Tests.Performance/BenchmarkDotNet.Artifacts/**/*.md
            tests/PDK.Tests.Performance/BenchmarkDotNet.Artifacts/**/*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Comment PR with Results
        # Only pull requests from this repository get a token that may comment (forks and Dependabot do not),
        # and a failed comment must never fail the benchmark job itself.
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const artifactsPath = 'tests/PDK.Tests.Performance/BenchmarkDotNet.Artifacts/results';

            let reportContent = '## Performance Benchmark Results\n\n';

            if (fs.existsSync(artifactsPath)) {
              const files = fs.readdirSync(artifactsPath, { recursive: true });
              const mdFiles = files.filter(f => f.endsWith('.md'));

              if (mdFiles.length > 0) {
                const reportPath = path.join(artifactsPath, mdFiles[0]);
                const report = fs.readFileSync(reportPath, 'utf8');

                // Truncate if too long
                const maxLength = 60000;
                reportContent += report.length > maxLength
                  ? report.substring(0, maxLength) + '\n\n... (truncated)'
                  : report;
              } else {
                reportContent += 'No benchmark results found.';
              }
            } else {
              reportContent += 'Benchmark artifacts directory not found.';
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reportContent
            });

  benchmark-comparison:
    name: Compare with Baseline
    runs-on: ubuntu-latest
    needs: benchmark
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Benchmark Results
        uses: actions/download-artifact@v8
        with:
          name: benchmark-results-${{ github.run_id }}
          path: benchmark-results
        # No artifact exists when the benchmark run produced no results; the comparison then only warns.
        continue-on-error: true

      - name: Check for Regressions
        run: node scripts/compare-benchmarks.js --results benchmark-results --baseline tests/PDK.Tests.Performance/Baselines/BaselineData.json --threshold 25
