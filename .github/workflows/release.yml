name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

# Never run two releases at the same time: they push to main and create tags.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_VERSION: '8.0.x'
  CONFIGURATION: 'Release'
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  # The version input is only consumed through this variable; it is never interpolated into a script.
  RELEASE_VERSION: ${{ github.event.inputs.version }}

jobs:
  release:
    name: Release PDK v${{ github.event.inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Validate version format
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format '$RELEASE_VERSION'. Use MAJOR.MINOR.PATCH (e.g., 1.0.0)"
            exit 1
          fi
          echo "Version format valid: $RELEASE_VERSION"

      # The checkout below authenticates as PAT_TOKEN. An empty or expired token fails there as
      # "fatal: could not read Username for 'https://github.com'" after three retries and half a
      # minute, which names neither the token nor the fix. Check it first and say what to do.
      - name: Check release credentials
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$PAT_TOKEN" ]; then
            echo "::error::PAT_TOKEN is not set. Releasing pushes the version commit and the v$RELEASE_VERSION tag to the protected main branch, which the default GITHUB_TOKEN cannot do. Add a personal access token with 'repo' scope as the PAT_TOKEN repository secret under Settings > Secrets and variables > Actions."
            exit 1
          fi

          # curl reports the HTTP status without failing the step, so each case can name its own fix.
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $PAT_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO")

          case "$STATUS" in
            200)
              echo "PAT_TOKEN is valid for $REPO"
              ;;
            401)
              echo "::error::PAT_TOKEN is invalid or has expired (GitHub answered 401). Issue a new personal access token with 'repo' scope and update the PAT_TOKEN repository secret."
              exit 1
              ;;
            403)
              echo "::error::PAT_TOKEN was refused for $REPO (GitHub answered 403). Check that the token is authorised for this account or organisation and has not exhausted its rate limit."
              exit 1
              ;;
            404)
              echo "::error::PAT_TOKEN cannot see $REPO (GitHub answered 404). A classic token needs 'repo' scope; a fine-grained token needs this repository in its selected repositories, with read and write access to contents."
              exit 1
              ;;
            *)
              echo "::error::Could not verify PAT_TOKEN against $REPO (GitHub answered $STATUS). Releasing would fail at checkout, so it is stopped here."
              exit 1
              ;;
          esac

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}  # PAT required to push to the protected main branch

      - name: Check that tag does not exist yet
        run: |
          if git rev-parse -q --verify "refs/tags/v$RELEASE_VERSION" > /dev/null 2>&1 \
             || git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" > /dev/null 2>&1; then
            echo "::error::Tag v$RELEASE_VERSION already exists. Pick a version that has not been released."
            exit 1
          fi
          echo "Tag v$RELEASE_VERSION is available"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update version
        run: ./scripts/set-version.sh "$RELEASE_VERSION"

      - name: Generate changelog
        run: ./scripts/generate-changelog.sh "$RELEASE_VERSION"

      # Everything below up to "Commit version and changelog" runs against the uncommitted version bump:
      # nothing is pushed until the build, the tests and the package are known to be good.
      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration ${{ env.CONFIGURATION }}

      - name: Pre-pull Docker images
        run: |
          docker pull mcr.microsoft.com/dotnet/sdk:8.0
          docker pull alpine:latest
          docker pull docker:latest
          docker pull node:18-alpine
        continue-on-error: true

      - name: Run unit tests with coverage
        run: dotnet test tests/PDK.Tests.Unit --no-build --configuration ${{ env.CONFIGURATION }} --collect:"XPlat Code Coverage" --settings coverlet.runsettings --logger "trx;LogFileName=test-results.trx"

      - name: Run integration tests with coverage
        env:
          PDK_DOCKER_TESTS: require
        run: dotnet test tests/PDK.Tests.Integration --no-build --configuration ${{ env.CONFIGURATION }} --collect:"XPlat Code Coverage" --settings coverlet.runsettings --logger "trx;LogFileName=integration-test-results.trx"

      - name: Pack
        run: dotnet pack src/PDK.CLI/PDK.CLI.csproj --no-build --configuration ${{ env.CONFIGURATION }} --output ./publish

      - name: List package contents
        run: |
          echo "Package created:"
          ls -lh ./publish/

      # Keep the package as a workflow artifact so a failed publish can be retried by hand.
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: pdk-${{ env.RELEASE_VERSION }}
          path: ./publish/*.nupkg
          retention-days: 30

      - name: Commit version and changelog
        run: |
          git add Directory.Build.props CHANGELOG.md
          git commit -m "chore: release v$RELEASE_VERSION"

      - name: Create Git tag
        run: git tag -a "v$RELEASE_VERSION" -m "PDK v$RELEASE_VERSION"

      - name: Push commit and tag
        run: |
          git push origin HEAD
          git push origin "v$RELEASE_VERSION"

      - name: Publish to NuGet
        if: env.NUGET_API_KEY != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push ./publish/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

      - name: Extract changelog for release
        run: |
          # Copy this version's section of CHANGELOG.md (up to the next "## [" heading) into release-notes.md
          awk -v version="$RELEASE_VERSION" '
            index($0, "## [" version "]") == 1 { in_section = 1; print; next }
            /^## \[/ { if (in_section) { exit } }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog section found for v$RELEASE_VERSION; the release notes will be empty"
          fi

      # The release is created with the PAT on purpose: events raised with the default GITHUB_TOKEN never
      # trigger other workflows. The same applies to the push above, which is what rebuilds the
      # documentation site for the new version - the docs workflow watches CHANGELOG.md on main.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          tag_name: v${{ env.RELEASE_VERSION }}
          name: PDK v${{ env.RELEASE_VERSION }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ startsWith(env.RELEASE_VERSION, '0.') }}
          files: ./publish/*.nupkg

      - name: Release summary
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "- **Version**: v$RELEASE_VERSION"
            echo "- **Tag**: v$RELEASE_VERSION"
            echo "- **GitHub Release**: Created"
            echo ""
            echo "### Installation"
            echo '```bash'
            echo "dotnet tool install -g pdk --version $RELEASE_VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
