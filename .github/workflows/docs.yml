name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'docfx.json'
      - '.github/workflows/docs.yml'
      # docfx publishes the root markdown as well (docfx.json content includes "*.md"), and the
      # release commit changes CHANGELOG.md on main - without this the site's changelog page
      # would still show the previous release. "*" does not cross directories, so this is root only.
      - '*.md'
  # No "release: [published]" trigger. That event runs on the tag ref (refs/tags/v2.0.0), and the
  # github-pages environment only allows deployments from the default branch, so the deploy job is
  # rejected before a runner is assigned. The release commit is pushed to main with the PAT, so the
  # push trigger above rebuilds the site anyway. To deploy from tags instead, allow them under
  # Settings > Environments > github-pages > Deployment branches and tags, then add the trigger back.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore

      - name: Generate documentation
        run: docfx docfx.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
