stages:
  - build
  - test
  - deploy

variables:
  CONFIGURATION: Release
  OUTPUT_DIR: "out/$CONFIGURATION"

default:
  image: alpine:3.20
  before_script:
    - echo "preparing $CI_JOB_NAME"

.unit: &unit
  stage: test
  script:
    - echo "testing $OUTPUT_DIR"

build:
  stage: build
  script:
    - mkdir -p "$OUTPUT_DIR"
    - echo built > "$OUTPUT_DIR/app.txt"
  artifacts:
    paths:
      - out/
    expire_in: 1 day

unit:
  <<: *unit

lint:
  stage: test
  needs: []
  script:
    - echo lint
  allow_failure: true

deploy:
  stage: deploy
  script:
    - cat "$OUTPUT_DIR/app.txt"
  after_script:
    - echo "deploy finished with $CI_JOB_STATUS"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
